name: Publish Docker image

# A version tag builds the image and pushes it to Docker Hub, once "Build and test" is green on the
# commit:  git tag -a v1.1.0 -m "PNMT 1.1.0" && git push origin v1.1.0
# The same tag publishes the Windows agent to the tag's GitHub release (docs/windows-sensor-plan.md
# §11): pnmt-sensor-x64.exe and pnmt-sensor-arm64.exe with their SHA-256. No tests run here.
on:
  push:
    tags: [ "v*" ]

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      # One image for amd64 and arm64: both build stages run on the runner's platform (Dockerfile),
      # only the runtime stage's package install runs under emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: uisach/pnmtd
          # The tag as it is (v1.1.0), and latest unless it is a pre-release (v1.2.0-rc1).
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          flavor: |
            latest=false

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: index.docker.io/uisach/pnmtd
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  agent_release:
    name: Publish the Windows agent to the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Single-file and self-contained for win-x64 and win-arm64 (EnableWindowsTargeting): the
      # executables' version is Directory.Build.props', so they match the image of the same tag.
      - name: Publish pnmt-sensor
        run: tools/agent.sh

      - name: Create the release, or add to it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            prerelease=()
            [[ "$tag" == *-* ]] && prerelease=(--prerelease)
            gh release create "$tag" --verify-tag --title "PNMT ${tag#v}" "${prerelease[@]}" \
              --notes "The PNMT sensor service for Windows: pnmt-sensor-x64.exe and pnmt-sensor-arm64.exe, unsigned; compare the SHA-256 with Get-FileHash."
          fi
          gh release upload "$tag" --clobber \
            artifacts/agent/pnmt-sensor-x64.exe artifacts/agent/pnmt-sensor-x64.exe.sha256 \
            artifacts/agent/pnmt-sensor-arm64.exe artifacts/agent/pnmt-sensor-arm64.exe.sha256
