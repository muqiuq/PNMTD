name: Publish the agents

# A sensor tag builds the PNMT agents and publishes them to the tag's GitHub release: the sensor service
# for Windows (docs/windows-sensor-plan.md §11), pnmt-sensor-x64.exe and pnmt-sensor-arm64.exe, and the
# agent for Linux (docs/linux-sensor-plan.md §12), pnmt-agent-linux-x64 and pnmt-agent-linux-arm64, each
# with its SHA-256 (sha256sum's format, so the Linux install line's sha256sum -c reads it). PNMTD serves
# the same files from its download folder, fetched from this release (docs/linux-sensor-plan.md §4.4).
#   git tag -a sensor-1.2.0 -m "PNMT Sensor 1.2.0" && git push origin sensor-1.2.0
# The version after "sensor-" is Directory.Build.props' (the executables report it, and PNMT's
# Download tab links to the release sensor-{its own version}); a dash makes it a pre-release
# (sensor-1.2.0-rc1). Version tags (v*) publish the Docker image only (push.yml). No tests run here.
on:
  push:
    tags: [ "sensor-*" ]

jobs:
  sensor_release:
    name: Publish the agents to the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Check the tag against the version
        run: |
          tag="${GITHUB_REF_NAME#sensor-}"
          version="$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Directory.Build.props | head -n 1)"
          if [[ "${tag%%-*}" != "${version%%-*}" ]]; then
            echo "::error::${GITHUB_REF_NAME} is for ${tag%%-*}, but Directory.Build.props is at ${version}: the executables would report ${version}, and PNMT ${tag%%-*} would not find them."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Single-file and self-contained: win-x64 and win-arm64 (EnableWindowsTargeting), linux-x64 and linux-arm64.
      - name: Publish pnmt-sensor and pnmt-agent
        run: PLATFORM=all tools/agent.sh

      - name: Create the release, or add to it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            prerelease=()
            [[ "$tag" == sensor-*-* ]] && prerelease=(--prerelease)
            gh release create "$tag" --verify-tag --title "PNMT agents ${tag#sensor-}" "${prerelease[@]}" \
              --notes "The PNMT sensor service for Windows (pnmt-sensor-x64.exe, pnmt-sensor-arm64.exe; compare the SHA-256 with Get-FileHash) and the PNMT agent for Linux (pnmt-agent-linux-x64, pnmt-agent-linux-arm64; sha256sum -c). Unsigned. PNMT serves the same files at /agent/v1/download/."
          fi
          gh release upload "$tag" --clobber \
            artifacts/agent/pnmt-sensor-x64.exe artifacts/agent/pnmt-sensor-x64.exe.sha256 \
            artifacts/agent/pnmt-sensor-arm64.exe artifacts/agent/pnmt-sensor-arm64.exe.sha256 \
            artifacts/agent/pnmt-agent-linux-x64 artifacts/agent/pnmt-agent-linux-x64.sha256 \
            artifacts/agent/pnmt-agent-linux-arm64 artifacts/agent/pnmt-agent-linux-arm64.sha256
