# Build and test on .NET 10 (docs/webui-migration-plan.md §6.6).
name: Build and test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    # The integration tests' PostgreSQL, where tools/test-db.sh puts it locally.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: Restore (locked)
      run: dotnet restore PNMTD.slnx --locked-mode
    - name: Build
      run: dotnet build PNMTD.slnx --no-restore
    - name: OpenAPI document up to date
      # The Debug build writes it (§3.7); the UI's types are generated from the committed copy.
      run: |
        if [ -n "$(git status --porcelain -- PNMTD.WebUI/src/api/openapi.json)" ]; then
          git diff -- PNMTD.WebUI/src/api/openapi.json | head -50
          echo "PNMTD.WebUI/src/api/openapi.json differs from the API: build and commit it." >&2
          exit 1
        fi
    - name: No model change without its migration
      run: dotnet tool restore && dotnet ef migrations has-pending-model-changes --project PNMTD/PNMTD.csproj --no-build
    # tools/dotnet-test.sh: dotnet test, and each failed test as an annotation on the run's page.
    - name: Test (time zone east of UTC)
      run: tools/dotnet-test.sh --solution PNMTD.slnx --no-build
    - name: Test (time zone west of UTC)
      run: PNMTD_TEST_TZ=America/New_York tools/dotnet-test.sh --project PNMTD.Tests/PNMTD.Tests.csproj --no-build

  # The web UI, in node containers as everywhere (§6.1): the package check, the registry's
  # signatures, types against openapi.json, vue-tsc, ESLint, Prettier, Vitest, the build; and the
  # shell scripts. GuardDog over the packages runs in supply-chain.yml when the lock file changes.
  web:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Web UI and scripts
      run: ENGINE=docker ./run-tests.sh --only web,shell

  # The sensor API must answer exactly as v0.12.1 does: hundreds of applications report to it.
  sensor-contract:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: Replay the golden contract against the image
      run: ENGINE=docker tools/contract.sh verify
    - name: Keep the actual recording
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: sensor-contract-actual
        path: artifacts/contract/actual.json

  # The production stack for real (deploy/, the v0.12 upgrade) and the browser tests (Playwright
  # against the image on the demo data), all in Docker as locally in Podman.
  stack:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0   # the v0.12.1 tag: the upgrade test builds the old release from it
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: deploy/, the v0.12 upgrade, the browser tests
      run: ENGINE=docker ./run-tests.sh --only deploy,upgrade,e2e
    - name: Keep the screenshots
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: screenshots
        path: PNMTD.WebUI/test-results/
        if-no-files-found: ignore
