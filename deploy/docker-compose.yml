# PNMTD's production stack (deploy/README.md). Local changes go into docker-compose.override.yml
# (gitignored), so `git pull` can replace this file.
#
#   ./init.sh && docker compose up -d && ./info.sh
#
# The repository's start.sh is the debugging setup; this file only ever runs a published image.
name: pnmtd

services:
  db:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pnmtd
      POSTGRES_DB: pnmtd
      POSTGRES_PASSWORD: "${PNMTD_DB_PASSWORD:?PNMTD_DB_PASSWORD is not set in .env - run ./init.sh (an upgrade from v0.12 - UPGRADING-1.0.md)}"
    volumes:
      # A new PostgreSQL major is ./backup.sh, a new image here, ./restore.sh — never just a new tag.
      - pnmtd-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U pnmtd -d pnmtd"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  pnmtd:
    image: ${PNMTD_IMAGE:-uisach/pnmtd}:${PNMTD_IMAGE_TAG:-v1.7.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # v0.12's port: the URLs hundreds of sensors report to keep working. Behind a reverse proxy on
      # this host, PNMTD_BIND_ADDRESS=127.0.0.1 keeps it off the network.
      - "${PNMTD_BIND_ADDRESS:-0.0.0.0}:${PNMTD_PORT:-5001}:8080"
      # UDP nodes (docs/udp-iot-plan.md §4.9): devices report here directly, never through the
      # reverse proxy. One setting, PNMTD_UDP_PORT, moves the published and the listening port
      # together; Udp__Enabled=false in .env turns the listener off.
      - "${PNMTD_UDP_BIND_ADDRESS:-0.0.0.0}:${PNMTD_UDP_PORT:-5028}:${PNMTD_UDP_PORT:-5028}/udp"
    # Every setting in .env reaches the app: Identity, PublicBaseUrl, TZ, Smtp__*, Auth__*, …
    env_file:
      - .env
    environment:
      Database__Host: db
      Database__Name: pnmtd
      Database__Username: pnmtd
      Database__Password: ${PNMTD_DB_PASSWORD}
      Udp__Port: ${PNMTD_UDP_PORT:-5028}
      # MikroTik routers and custom tunnels (docs/mikrotik-plan.md §3.3): what routers dial. Set in
      # .env, the external host and port win over the admin page.
      WireGuard__PublishedPort: ${PNMTD_WG_PORT:-51820}
      WireGuard__ExternalHost: ${PNMTD_WG_EXTERNAL_HOST:-}
      WireGuard__ExternalPort: ${PNMTD_WG_EXTERNAL_PORT:-}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"   # PING sensors as a non-root user, no capability
    volumes:
      - pnmtd-keys:/var/lib/pnmtd/keys             # sessions and 2FA secrets: backed up by ./backup.sh
      # The agents' files PNMT serves (docs/linux-sensor-plan.md §4.4), fetched from the GitHub release of this version into
      # sensor-<version>/; not backed up. For a PNMT without internet, mount a folder with the release's files here instead.
      - pnmtd-downloads:/var/lib/pnmtd/downloads
      # Uploaded files (docs/locations-knowledge-plan.md §5.5): a folder on this host, not a volume. Backed up by ./backup.sh.
      # ./init.sh creates it for the app's user (uid 1654, 0750); PNMTD_FILES_DIR in .env moves it (./ or / first).
      - ${PNMTD_FILES_DIR:-./files}:/var/lib/pnmtd/files
    healthcheck:                                   # here as well: Podman's OCI images drop HEALTHCHECK
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s                            # a new release applies its migrations first
      retries: 3
    stop_grace_period: 40s                         # .NET's shutdown timeout is 30 s; Docker's default grace 10 s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # The WireGuard gateway (docs/mikrotik-plan.md §3.4), only with COMPOSE_PROFILES=wireguard in .env.
  # The same image as root with two capabilities: it owns wg0 and its firewall, takes its peers from the
  # database, and passes the app's SSH connections into the tunnel over SOCKS5 on this network. The
  # app stays non-root, read-only and without capabilities. Needs the WireGuard kernel module (Linux 5.6+).
  pnmtd-wg:
    image: ${PNMTD_IMAGE:-uisach/pnmtd}:${PNMTD_IMAGE_TAG:-v1.7.0}
    profiles: [wireguard]
    command: ["wireguard", "gateway"]
    user: "0:0"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PNMTD_WG_BIND_ADDRESS:-0.0.0.0}:${PNMTD_WG_PORT:-51820}:51820/udp"
    environment:
      Database__Host: db
      Database__Name: pnmtd
      Database__Username: pnmtd
      Database__Password: ${PNMTD_DB_PASSWORD}
      WireGuard__Enabled: "true"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    # NET_ADMIN: wg0 and nftables. DAC_READ_SEARCH: reading the key ring, which the app's non-root user
    # owns (0600), to decrypt the tunnel keys; nothing else is mounted.
    cap_add: [NET_ADMIN, DAC_READ_SEARCH]
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_forward: "1"                     # custom tunnels only; nftables drops everything else
    volumes:
      - pnmtd-keys:/var/lib/pnmtd/keys:ro          # decrypts the tunnel keys; never writes the key ring
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pnmtd-pgdata:
  pnmtd-keys:
  pnmtd-downloads:
